<svg width="296" height="68" viewBox="0 0 296 68" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4 GitHub stars">
  <title>GitHub stars: 4</title>
  <style>
    .pill { filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
    .label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .09em; text-transform: uppercase; fill: rgba(255,255,255,.78); text-anchor: middle; }
    .value { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 26px; fill: #fff; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="gStars" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fab848"/>
      <stop offset="1" stop-color="#e08a06"/>
    </linearGradient>
  </defs>
  <g class="pill">
    <rect x="2" y="2" width="292" height="64" rx="32" fill="url(#gStars)"/>
    <text x="148" y="28" class="label">Stars</text>
    <text x="148" y="54" class="value">4</text>
  </g>
</svg>
